AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Intelligent Cloud Storage Cost Optimizer - Milestone 1 infrastructure

Resources:

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
  AccessHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
        - AttributeName: access_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH
        - AttributeName: access_timestamp
          KeyType: RANGE

  DocumentAggregatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/documents/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${DocumentsBucket.Arn}/*"

            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt DocumentsTable.Arn

            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Query
              Resource: !GetAtt AccessHistoryTable.Arn

      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable
          ACCESS_HISTORY_TABLE: !Ref AccessHistoryTable

      Events:
        DocumentsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents
            Method: ANY

        DocumentByIdApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents/{document_id}
            Method: ANY

        DocumentDownloadApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents/{document_id}/download
            Method: GET
        DocumentAccessStatsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents/{document_id}/access-stats
            Method: GET

  AggregatesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/aggregates/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 60
      MemorySize: 512

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: !GetAtt DocumentsTable.Arn

            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !GetAtt AccessHistoryTable.Arn

            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:BatchWriteItem
              Resource: !GetAtt DocumentAggregatesTable.Arn

      Environment:
        Variables:
          DOCUMENTS_TABLE: !Ref DocumentsTable
          ACCESS_HISTORY_TABLE: !Ref AccessHistoryTable
          AGGREGATES_TABLE: !Ref DocumentAggregatesTable

      Events:
        AggregatesRunApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /aggregates/run
            Method: POST

  DocumentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

Outputs:

  DocumentsBucketName:
    Description: S3 bucket used for project documents
    Value: !Ref DocumentsBucket

  DocumentsTableName:
    Description: DynamoDB table used for document metadata
    Value: !Ref DocumentsTable

  AccessHistoryTableName:
    Description: DynamoDB table holding raw document access events
    Value: !Ref AccessHistoryTable

  DocumentsApiEndpoint:
    Description: Base URL of the documents/aggregates HTTP API
    Value: !Sub "https://${DocumentsHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  DocumentAggregatesTableName:
    Description: DynamoDB table containing aggregated document optimization features
    Value: !Ref DocumentAggregatesTable