AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Intelligent Cloud Storage Cost Optimizer - Milestone 1 infrastructure

Resources:

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      AttributeDefinitions:
        - AttributeName: document_id
          AttributeType: S
      KeySchema:
        - AttributeName: document_id
          KeyType: HASH

  DocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/documents/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${DocumentsBucket.Arn}/*"

            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Scan
              Resource: !GetAtt DocumentsTable.Arn

      Environment:
        Variables:
          DOCUMENTS_BUCKET: !Ref DocumentsBucket
          DOCUMENTS_TABLE: !Ref DocumentsTable

      Events:
        DocumentsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents
            Method: ANY

        DocumentByIdApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref DocumentsHttpApi
            Path: /documents/{document_id}
            Method: ANY

  DocumentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

Outputs:

  DocumentsBucketName:
    Description: S3 bucket used for project documents
    Value: !Ref DocumentsBucket

  DocumentsTableName:
    Description: DynamoDB table used for document metadata
    Value: !Ref DocumentsTable